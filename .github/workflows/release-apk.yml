name: Tracepath Release Build

# Manual only: signed release artifacts are built on demand, not on every
# push, since this workflow needs the production signing secrets below.
on:
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Fails fast, before Gradle runs, on the two known Android resource
      # pitfalls in this project: "--" inside an XML comment (invalid per
      # the XML spec) and duplicate resource name/type declarations across
      # res/values*/*.xml (rejected by the AAPT2 resource merger).
      - name: Verify Android resources (colors.xml + duplicate check)
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET
          import os, re, sys, collections

          res_dir = "android/app/src/main/res"
          problems = []

          # 1) "--" is never allowed inside an XML comment's content.
          comment_re = re.compile(r"<!--(.*?)-->", re.DOTALL)
          for dirpath, _, files in os.walk(res_dir):
              for f in files:
                  if f.endswith(".xml"):
                      path = os.path.join(dirpath, f)
                      with open(path, encoding="utf-8") as fh:
                          content = fh.read()
                      for m in comment_re.finditer(content):
                          if "--" in m.group(1):
                              problems.append(
                                  f'{path}: invalid XML comment contains "--": '
                                  f'<!--{m.group(1)}-->'
                              )

          # 2) No duplicate (type, name) resource declared twice within the
          #    same values*/ qualifier directory.
          for dirpath, _, files in os.walk(res_dir):
              if not os.path.basename(dirpath).startswith("values"):
                  continue
              seen = collections.defaultdict(list)
              for f in files:
                  if not f.endswith(".xml"):
                      continue
                  path = os.path.join(dirpath, f)
                  try:
                      tree = ET.parse(path)
                  except ET.ParseError as e:
                      problems.append(f"{path}: XML parse error: {e}")
                      continue
                  for child in tree.getroot():
                      name = child.get("name")
                      if name:
                          seen[(child.tag, name)].append(path)
              for (tag, name), paths in seen.items():
                  if len(paths) > 1:
                      problems.append(
                          f"Duplicate resource {tag}/{name} declared in: "
                          f"{', '.join(paths)}"
                      )

          if problems:
              print("Resource safety check FAILED:")
              for p in problems:
                  print(" -", p)
              sys.exit(1)

          print("Resource safety check passed: no invalid \"--\" comments, "
                "no duplicate resources.")
          PYEOF

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret. See android/keystore.properties.example."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/tracepath-release.jks
          cat > android/keystore.properties << PROPS
          storeFile=tracepath-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Build signed release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Verify build outputs exist
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "Missing $APK"; exit 1; }
          test -f "$AAB" || { echo "Missing $AAB"; exit 1; }
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "AAB: $AAB ($(du -h "$AAB" | cut -f1))"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tracepath-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tracepath-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
