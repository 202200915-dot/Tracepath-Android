name: Build Tracepath APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Always produced: installable immediately, auto-signed with the
      # Android debug key. Good for testing on your own phone.
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Collect debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tracepath-debug.apk

      # Optional: only runs if you've added the KEYSTORE_BASE64 /
      # KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repo secrets
      # (Settings -> Secrets and variables -> Actions). See README.md
      # "Signing a release build" for how to create and encode a keystore.
      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/tracepath-release.jks
          cat > android/keystore.properties << PROPS
          storeFile=tracepath-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Build signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Collect release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk Tracepath.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tracepath-debug
          path: Tracepath-debug.apk

      - name: Upload release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tracepath
          path: Tracepath.apk
